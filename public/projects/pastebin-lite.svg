<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ebebeb" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- HEADER BAR -->
  <rect x="40" y="30" width="720" height="54" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="62" y="50" width="80" height="8" rx="4" fill="#171717" opacity="0.7"/>
  <!-- New Paste button -->
  <rect x="630" y="40" width="110" height="32" rx="8" fill="#171717"/>
  <rect x="652" y="52" width="66" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>

  <!-- EDITOR PANEL -->
  <rect x="40" y="102" width="486" height="368" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <!-- Tab bar -->
  <rect x="40" y="102" width="486" height="38" rx="10" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="60" y="117" width="52" height="6" rx="3" fill="#171717" opacity="0.45"/>
  <rect x="122" y="117" width="52" height="6" rx="3" fill="#d4d4d4"/>
  <rect x="184" y="117" width="40" height="6" rx="3" fill="#d4d4d4"/>
  <line x1="40" y1="140" x2="526" y2="140" stroke="#ebebeb" stroke-width="1"/>

  <!-- LINE NUMBERS column -->
  <rect x="40" y="140" width="36" height="330" rx="0" fill="#fafafa"/>
  <line x1="76" y1="140" x2="76" y2="470" stroke="#ebebeb" stroke-width="1"/>
  <!-- Line number stubs -->
  <rect x="52" y="155" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="173" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="191" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="209" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="227" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="245" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="263" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="281" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="299" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="317" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="335" width="12" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="52" y="353" width="12" height="4" rx="2" fill="#d4d4d4"/>

  <!-- CODE LINES — syntax-colored tokens on white -->
  <!-- Line 1: keyword + identifier -->
  <rect x="88" y="153" width="58" height="5" rx="2.5" fill="#7928ca" opacity="0.55"/>
  <rect x="154" y="153" width="110" height="5" rx="2.5" fill="#4d4d4d" opacity="0.4"/>

  <!-- Line 2 -->
  <rect x="88" y="171" width="44" height="5" rx="2.5" fill="#007cf0" opacity="0.55"/>
  <rect x="140" y="171" width="166" height="5" rx="2.5" fill="#4d4d4d" opacity="0.3"/>

  <!-- Line 3 (highlighted / active line) -->
  <rect x="76" y="187" width="450" height="18" rx="4" fill="#fafafa"/>
  <rect x="88" y="191" width="36" height="5" rx="2.5" fill="#f9cb28" opacity="0.65"/>
  <rect x="132" y="191" width="186" height="5" rx="2.5" fill="#4d4d4d" opacity="0.4"/>
  <rect x="326" y="191" width="54" height="5" rx="2.5" fill="#00dfd8" opacity="0.55"/>

  <!-- Line 4 -->
  <rect x="88" y="209" width="56" height="5" rx="2.5" fill="#4d4d4d" opacity="0.3"/>
  <rect x="152" y="209" width="130" height="5" rx="2.5" fill="#4d4d4d" opacity="0.4"/>

  <!-- Line 5 -->
  <rect x="88" y="227" width="84" height="5" rx="2.5" fill="#7928ca" opacity="0.4"/>
  <rect x="180" y="227" width="96" height="5" rx="2.5" fill="#4d4d4d" opacity="0.3"/>

  <!-- Line 6 -->
  <rect x="88" y="245" width="28" height="5" rx="2.5" fill="#4d4d4d" opacity="0.25"/>
  <rect x="124" y="245" width="236" height="5" rx="2.5" fill="#4d4d4d" opacity="0.35"/>

  <!-- Line 7 -->
  <rect x="88" y="263" width="64" height="5" rx="2.5" fill="#007cf0" opacity="0.45"/>
  <rect x="160" y="263" width="150" height="5" rx="2.5" fill="#4d4d4d" opacity="0.3"/>

  <!-- Line 8 -->
  <rect x="88" y="281" width="172" height="5" rx="2.5" fill="#4d4d4d" opacity="0.25"/>

  <!-- Line 9 -->
  <rect x="88" y="299" width="46" height="5" rx="2.5" fill="#f9cb28" opacity="0.5"/>
  <rect x="142" y="299" width="116" height="5" rx="2.5" fill="#4d4d4d" opacity="0.35"/>

  <!-- Line 10 -->
  <rect x="88" y="317" width="96" height="5" rx="2.5" fill="#4d4d4d" opacity="0.25"/>
  <rect x="192" y="317" width="76" height="5" rx="2.5" fill="#00dfd8" opacity="0.45"/>

  <!-- Lines 11–12 (fading) -->
  <rect x="88" y="335" width="140" height="5" rx="2.5" fill="#ebebeb"/>
  <rect x="88" y="353" width="196" height="5" rx="2.5" fill="#ebebeb"/>

  <!-- SIDEBAR — metadata panel -->
  <rect x="544" y="102" width="216" height="184" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="566" y="124" width="52" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="566" y="138" width="152" height="8" rx="4" fill="#171717" opacity="0.65"/>
  <!-- Expiry row -->
  <rect x="566" y="164" width="44" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="566" y="178" width="90" height="6" rx="3" fill="#7928ca" opacity="0.18"/>
  <!-- Language row -->
  <rect x="566" y="200" width="52" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="566" y="214" width="76" height="6" rx="3" fill="#7928ca" opacity="0.18"/>
  <!-- Share button -->
  <rect x="566" y="238" width="172" height="30" rx="8" fill="#171717"/>
  <rect x="610" y="250" width="84" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>

  <!-- SIDEBAR — recent pastes -->
  <rect x="544" y="302" width="216" height="168" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="566" y="322" width="72" height="6" rx="3" fill="#4d4d4d" opacity="0.5"/>
  <!-- Paste rows -->
  <rect x="566" y="344" width="172" height="34" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="578" y="354" width="96" height="5" rx="2.5" fill="#4d4d4d" opacity="0.45"/>
  <rect x="578" y="365" width="56" height="4" rx="2" fill="#d4d4d4"/>

  <rect x="566" y="386" width="172" height="34" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="578" y="396" width="116" height="5" rx="2.5" fill="#4d4d4d" opacity="0.45"/>
  <rect x="578" y="407" width="46" height="4" rx="2" fill="#d4d4d4"/>

  <rect x="566" y="428" width="172" height="24" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="578" y="437" width="86" height="5" rx="2.5" fill="#d4d4d4"/>
</svg>

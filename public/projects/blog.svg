<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ebebeb" stroke-width="0.5"/>
    </pattern>
    <!-- Ship gradient: red→amber for hero accent -->
    <linearGradient id="heroAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f9cb28" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- HERO BANNER -->
  <rect x="40" y="30" width="720" height="164" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <!-- Hero eyebrow -->
  <rect x="68" y="58" width="80" height="5" rx="2.5" fill="#8f8f8f"/>
  <!-- Hero headline (2 lines) -->
  <rect x="68" y="74" width="270" height="16" rx="5" fill="#171717" opacity="0.8"/>
  <rect x="68" y="98" width="210" height="16" rx="5" fill="#171717" opacity="0.55"/>
  <!-- Sub text -->
  <rect x="68" y="126" width="340" height="5" rx="2.5" fill="#d4d4d4"/>
  <rect x="68" y="138" width="300" height="5" rx="2.5" fill="#d4d4d4"/>
  <!-- Read CTA -->
  <rect x="68" y="160" width="110" height="16" rx="8" fill="#171717" opacity="0.08"/>

  <!-- Hero image block — ship gradient accent -->
  <rect x="584" y="46" width="148" height="132" rx="10" fill="url(#heroAccent)" stroke="#ebebeb" stroke-width="1"/>
  <!-- Abstract icon -->
  <rect x="626" y="84" width="64" height="56" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="638" y="96" width="40" height="5" rx="2.5" fill="#ff4d4d" opacity="0.4"/>
  <rect x="638" y="108" width="28" height="5" rx="2.5" fill="#f9cb28" opacity="0.5"/>
  <rect x="638" y="120" width="34" height="5" rx="2.5" fill="#ff4d4d" opacity="0.3"/>

  <!-- ARTICLE CARD GRID — 3 cols -->
  <!-- Card 1 -->
  <rect x="40" y="218" width="226" height="252" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <!-- Card image region -->
  <rect x="40" y="218" width="226" height="106" rx="10" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="40" y="314" width="226" height="10" rx="0" fill="#ffffff"/>
  <!-- Tag pill -->
  <rect x="60" y="340" width="54" height="16" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="70" y="345" width="34" height="4" rx="2" fill="#007cf0" opacity="0.5"/>
  <!-- Title lines -->
  <rect x="60" y="366" width="180" height="7" rx="3.5" fill="#171717" opacity="0.6"/>
  <rect x="60" y="380" width="140" height="7" rx="3.5" fill="#171717" opacity="0.4"/>
  <!-- Meta row -->
  <rect x="60" y="408" width="72" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="158" y="408" width="56" height="4" rx="2" fill="#d4d4d4"/>

  <!-- Card 2 -->
  <rect x="288" y="218" width="224" height="252" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="288" y="218" width="224" height="106" rx="10" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="288" y="314" width="224" height="10" rx="0" fill="#ffffff"/>
  <rect x="308" y="340" width="54" height="16" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="318" y="345" width="34" height="4" rx="2" fill="#7928ca" opacity="0.4"/>
  <rect x="308" y="366" width="188" height="7" rx="3.5" fill="#171717" opacity="0.6"/>
  <rect x="308" y="380" width="150" height="7" rx="3.5" fill="#171717" opacity="0.4"/>
  <rect x="308" y="408" width="72" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="406" y="408" width="56" height="4" rx="2" fill="#d4d4d4"/>

  <!-- Card 3 -->
  <rect x="534" y="218" width="226" height="252" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="534" y="218" width="226" height="106" rx="10" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="534" y="314" width="226" height="10" rx="0" fill="#ffffff"/>
  <rect x="554" y="340" width="54" height="16" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <rect x="564" y="345" width="34" height="4" rx="2" fill="#00dfd8" opacity="0.55"/>
  <rect x="554" y="366" width="168" height="7" rx="3.5" fill="#171717" opacity="0.6"/>
  <rect x="554" y="380" width="130" height="7" rx="3.5" fill="#171717" opacity="0.4"/>
  <rect x="554" y="408" width="72" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="652" y="408" width="56" height="4" rx="2" fill="#d4d4d4"/>
</svg>

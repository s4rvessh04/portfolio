name: Deploy to Cloudflare Pages

# Triggers on every push to main (i.e., when a PR is merged),
# plus a manual button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy hook URL is stored as a repo secret:
#   CLOUDFLARE_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions)
jobs:
  deploy:
    name: Trigger Pages deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi

          http_code="$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --retry 2 --retry-delay 5 \
            -o cf_response.json \
            -w "%{http_code}" \
            "$DEPLOY_HOOK_URL")"

          echo "Cloudflare deploy-hook responded with HTTP $http_code"
          cat cf_response.json | jq . || true

          # Cloudflare returns 200 {"success": true} on a queued deploy
          if [ "$http_code" -ne 200 ]; then
            echo "::error::Deploy hook failed (HTTP $http_code)."
            exit 1
          fi

          jq -e '.success == true' cf_response.json > /dev/null \
            || { echo "::error::Cloudflare reported success=false."; cat cf_response.json; exit 1; }

          echo "Deploy queued on Cloudflare Pages."

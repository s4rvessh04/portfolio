<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(150,150,150,0.3)" stroke-width="0.5"/>
    </pattern>
    <!-- Preview gradient: violet→pink -->
    <linearGradient id="sentBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- SIDEBAR -->
  <rect x="30" y="30" width="210" height="440" rx="10" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <!-- Sidebar header -->
  <rect x="50" y="52" width="70" height="7" rx="3.5" fill="rgba(150,150,150,0.7)"/>
  <rect x="190" y="50" width="24" height="24" rx="12" fill="rgba(150,150,150,0.12)"/>
  <rect x="197" y="58" width="10" height="8" rx="2" fill="rgba(150,150,150,0.3)"/>

  <!-- Chat list divider -->
  <line x1="30" y1="84" x2="240" y2="84" stroke="rgba(150,150,150,0.3)" stroke-width="1"/>

  <!-- Chat item 1 — active (violet tint) -->
  <rect x="38" y="94" width="194" height="58" rx="8" fill="rgba(150,150,150,0.12)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <circle cx="62" cy="123" r="15" fill="rgba(150,150,150,0.3)"/>
  <rect x="62" cy="123" cx="62" r="0"/>
  <!-- Avatar initials placeholder -->
  <rect x="54" y="118" width="16" height="10" rx="3" fill="rgba(150,150,150,0.3)"/>
  <rect x="85" y="106" width="72" height="6" rx="3" fill="rgba(150,150,150,0.7)"/>
  <rect x="85" y="118" width="110" height="5" rx="2.5" fill="rgba(150,150,150,0.4)"/>
  <circle cx="214" cy="108" r="5" fill="#7928ca" opacity="0.6"/>

  <!-- Chat item 2 -->
  <rect x="38" y="160" width="194" height="58" rx="8" fill="none"/>
  <circle cx="62" cy="189" r="15" fill="rgba(150,150,150,0.12)"/>
  <rect x="54" y="184" width="16" height="10" rx="3" fill="rgba(150,150,150,0.3)"/>
  <rect x="85" y="172" width="60" height="6" rx="3" fill="rgba(150,150,150,0.7)"/>
  <rect x="85" y="184" width="90" height="5" rx="2.5" fill="rgba(150,150,150,0.3)"/>

  <!-- Chat item 3 -->
  <circle cx="62" cy="255" r="15" fill="rgba(150,150,150,0.12)"/>
  <rect x="54" y="250" width="16" height="10" rx="3" fill="rgba(150,150,150,0.3)"/>
  <rect x="85" y="238" width="76" height="6" rx="3" fill="rgba(150,150,150,0.7)"/>
  <rect x="85" y="250" width="84" height="5" rx="2.5" fill="rgba(150,150,150,0.3)"/>

  <!-- Chat item 4 -->
  <circle cx="62" cy="321" r="15" fill="rgba(150,150,150,0.12)"/>
  <rect x="54" y="316" width="16" height="10" rx="3" fill="rgba(150,150,150,0.3)"/>
  <rect x="85" y="304" width="56" height="6" rx="3" fill="rgba(150,150,150,0.7)"/>
  <rect x="85" y="316" width="100" height="5" rx="2.5" fill="rgba(150,150,150,0.3)"/>

  <!-- MAIN CHAT AREA -->
  <rect x="260" y="30" width="510" height="440" rx="10" fill="rgba(150,150,150,0.05)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>

  <!-- Chat header -->
  <rect x="260" y="30" width="510" height="64" rx="10" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <!-- Name -->
  <rect x="292" y="52" width="90" height="7" rx="3.5" fill="rgba(150,150,150,0.7)"/>
  <rect x="292" y="67" width="55" height="4" rx="2" fill="rgba(150,150,150,0.4)"/>
  <!-- Online dot -->
  <circle cx="735" cy="58" r="5" fill="#00dfd8" opacity="0.8"/>
  <rect x="700" y="55" width="26" height="4" rx="2" fill="rgba(150,150,150,0.3)"/>

  <!-- MESSAGES — received (left, white pill) -->
  <rect x="280" y="114" width="230" height="48" rx="14" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <rect x="298" y="128" width="150" height="5" rx="2.5" fill="rgba(150,150,150,0.7)"/>
  <rect x="298" y="142" width="96" height="5" rx="2.5" fill="rgba(150,150,150,0.4)"/>

  <!-- MESSAGES — sent (right, preview gradient) -->
  <rect x="490" y="186" width="256" height="48" rx="14" fill="url(#sentBg)" stroke="#7928ca" stroke-width="0.75" stroke-opacity="0.25"/>
  <rect x="508" y="200" width="160" height="5" rx="2.5" fill="#7928ca" opacity="0.45"/>
  <rect x="508" y="214" width="106" height="5" rx="2.5" fill="#7928ca" opacity="0.3"/>

  <!-- MESSAGES — received -->
  <rect x="280" y="258" width="286" height="64" rx="14" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <rect x="298" y="272" width="200" height="5" rx="2.5" fill="rgba(150,150,150,0.7)"/>
  <rect x="298" y="284" width="150" height="5" rx="2.5" fill="rgba(150,150,150,0.4)"/>
  <rect x="298" y="296" width="106" height="5" rx="2.5" fill="rgba(150,150,150,0.4)"/>

  <!-- MESSAGES — sent -->
  <rect x="510" y="346" width="236" height="48" rx="14" fill="url(#sentBg)" stroke="#7928ca" stroke-width="0.75" stroke-opacity="0.25"/>
  <rect x="528" y="360" width="136" height="5" rx="2.5" fill="#7928ca" opacity="0.45"/>
  <rect x="528" y="374" width="84" height="5" rx="2.5" fill="#7928ca" opacity="0.3"/>

  <!-- TYPING INDICATOR -->
  <rect x="280" y="416" width="88" height="34" rx="17" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
  <circle cx="304" cy="433" r="4" fill="rgba(150,150,150,0.3)"/>
  <circle cx="320" cy="433" r="4" fill="rgba(150,150,150,0.2)"/>
  <circle cx="336" cy="433" r="4" fill="rgba(150,150,150,0.12)"/>

  <!-- INPUT BAR -->
  <rect x="272" y="456" width="486" height="6" rx="3" fill="rgba(150,150,150,0.08)" stroke="rgba(150,150,150,0.4)" stroke-width="1"/>
</svg>

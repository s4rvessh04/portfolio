<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ebebeb" stroke-width="0.5"/>
    </pattern>
    <!-- Geist develop gradient: blue→cyan -->
    <linearGradient id="devGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007cf0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- CLIENT BOXES — left column -->
  <!-- Client 1 -->
  <rect x="30" y="110" width="110" height="56" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="46" y="126" width="44" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="46" y="138" width="30" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="100" y="126" width="16" height="16" rx="8" fill="#f2f2f2"/>

  <!-- Client 2 -->
  <rect x="30" y="222" width="110" height="56" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="46" y="238" width="44" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="46" y="250" width="30" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="100" y="238" width="16" height="16" rx="8" fill="#f2f2f2"/>

  <!-- Client 3 -->
  <rect x="30" y="334" width="110" height="56" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="46" y="350" width="44" height="5" rx="2.5" fill="#8f8f8f"/>
  <rect x="46" y="362" width="30" height="4" rx="2" fill="#d4d4d4"/>
  <rect x="100" y="350" width="16" height="16" rx="8" fill="#f2f2f2"/>

  <!-- DASHED LINES: clients → load balancer -->
  <line x1="140" y1="138" x2="226" y2="218" stroke="#ebebeb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="140" y1="250" x2="226" y2="250" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="140" y1="362" x2="226" y2="282" stroke="#ebebeb" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- LOAD BALANCER CENTER BOX -->
  <rect x="226" y="175" width="200" height="150" rx="12" fill="url(#devGrad)" stroke="#007cf0" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Inner circle + cross icon -->
  <circle cx="326" cy="228" r="28" fill="#ffffff" opacity="0.7"/>
  <line x1="326" y1="212" x2="326" y2="244" stroke="#007cf0" stroke-width="2" opacity="0.8"/>
  <line x1="310" y1="228" x2="342" y2="228" stroke="#007cf0" stroke-width="2" opacity="0.8"/>
  <!-- Label bar -->
  <rect x="268" y="272" width="116" height="6" rx="3" fill="#007cf0" opacity="0.25"/>
  <!-- Health dots -->
  <circle cx="285" cy="296" r="5" fill="#00dfd8" opacity="0.65"/>
  <circle cx="302" cy="296" r="5" fill="#00dfd8" opacity="0.65"/>
  <circle cx="319" cy="296" r="5" fill="#00dfd8" opacity="0.65"/>
  <circle cx="336" cy="296" r="5" fill="#ff4d4d" opacity="0.35"/>

  <!-- LINES: load balancer → servers -->
  <line x1="426" y1="218" x2="510" y2="115" stroke="#d4d4d4" stroke-width="1.5"/>
  <line x1="426" y1="250" x2="510" y2="250" stroke="#ebebeb" stroke-width="1.5"/>
  <line x1="426" y1="282" x2="510" y2="385" stroke="#d4d4d4" stroke-width="1.5"/>

  <!-- SERVER BOXES — right column -->
  <!-- Server 1 -->
  <rect x="510" y="66" width="256" height="100" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="534" y="88" width="60" height="6" rx="3" fill="#4d4d4d"/>
  <rect x="534" y="102" width="40" height="4" rx="2" fill="#a1a1a1"/>
  <!-- CPU bar -->
  <rect x="534" y="120" width="140" height="6" rx="3" fill="#f2f2f2"/>
  <rect x="534" y="120" width="52" height="6" rx="3" fill="#00dfd8" opacity="0.6"/>
  <rect x="534" y="136" width="100" height="4" rx="2" fill="#f2f2f2"/>
  <!-- Status dot -->
  <circle cx="740" cy="88" r="6" fill="#007cf0" opacity="0.7"/>

  <!-- Server 2 -->
  <rect x="510" y="200" width="256" height="100" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="534" y="222" width="60" height="6" rx="3" fill="#4d4d4d"/>
  <rect x="534" y="236" width="40" height="4" rx="2" fill="#a1a1a1"/>
  <rect x="534" y="254" width="140" height="6" rx="3" fill="#f2f2f2"/>
  <rect x="534" y="254" width="98" height="6" rx="3" fill="#f9cb28" opacity="0.55"/>
  <rect x="534" y="270" width="100" height="4" rx="2" fill="#f2f2f2"/>
  <circle cx="740" cy="222" r="6" fill="#007cf0" opacity="0.7"/>

  <!-- Server 3 -->
  <rect x="510" y="334" width="256" height="100" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <rect x="534" y="356" width="60" height="6" rx="3" fill="#4d4d4d"/>
  <rect x="534" y="370" width="40" height="4" rx="2" fill="#a1a1a1"/>
  <rect x="534" y="388" width="140" height="6" rx="3" fill="#f2f2f2"/>
  <rect x="534" y="388" width="22" height="6" rx="3" fill="#007cf0" opacity="0.4"/>
  <rect x="534" y="404" width="100" height="4" rx="2" fill="#f2f2f2"/>
  <circle cx="740" cy="356" r="6" fill="#ff4d4d" opacity="0.4"/>
</svg>
